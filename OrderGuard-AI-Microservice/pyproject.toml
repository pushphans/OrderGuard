[project]
name = "orderguard-ai"
version = "0.1.0"
description = "OrderGuard AI microservice - cart, orders and AI commerce tools"
readme = "README.md"
authors = [
    { name = "pushphans", email = "pushp.hans.official@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.8",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
orderguard-ai = "orderguard_ai:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
