# A generic, single database configuration.

[alembic]
# path to migration scripts, relative to this ini file
script_location = %(here)s/migrations

# prepend sys.path so the orderguard_ai package is importable from src/
prepend_sys_path = src

# use the OS path separator
path_separator = os

# the database URL is set at runtime from the service's Settings (see env.py)
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]


# Logging configuration. This is also consumed by the user-maintained env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
